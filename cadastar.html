<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="shortcut icon" href="favicon (1).ico" type="image/x-icon">
    <link rel="stylesheet" href="cadastra.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(PGS) cadastro</title>
</head>
<body>

<header>
    <div class="logo-titulo">
        <img src="favicon (1).ico" alt="Logo PGS" class="logo">
        <div>
            <h1>portal geografico <span>sul-americano</span></h1>
            <p>PGS — INFORMAÇÃO E TERRITÓRIO</p>
        </div>
    </div>
</header>
    
<div class="login-box">
    <h2>Olá, nós ajude com suas interaçoes tendo sua <span>conta!</span></h2>
    <hr>

    <input type="text" id="nome" placeholder="Nome" maxlength="10">
    <input type="text" id="sobrenome" placeholder="Sobrenome (opcional)" maxlength="4">
    <input type="email" id="email" placeholder="E-mail">
    <input type="email" id="emailc" placeholder="Confirmar e-mail">
    <input type="tel" id="numero" placeholder="Número de telefone" inputmode="numeric" pattern="[0-9]*">

    <div class="senha-box">
    <input type="password" id="senha" placeholder="Senha">
    <img src="olho.png" id="olho-senha" onclick="verSenha('senha', 'olho-senha')" class="olho">
</div>
<div class="senha-box">
    <input type="password" id="senhac" placeholder="Confirmar senha">
    <img src="olho.png" id="olho-senhac" onclick="verSenha('senhac', 'olho-senhac')" class="olho">
</div>

<div class="foto-box">
    <img id="foto-preview" src="images.jpeg" class="foto-preview">
    <label class="btn-foto">
        Escolher foto
        <input type="file" id="foto" accept="image/*" onchange="previewFoto()">
    </label>
</div>

    <button class="btn-entrar" onclick="entrar()">CADASTRAR</button>

    <hr>

    <p class="rodape">Já tem uma conta? <a href="login.html">Entrar</a></p>
    <p class="rodape">Quer voltar? <a href="index.html">Menu</a></p>
</div>

<script src="cadastar.js"></script>
</body>
</html>
