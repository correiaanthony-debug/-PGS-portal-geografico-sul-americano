<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="shortcut icon" href="favicon (1).ico" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(PGS) login</title>
</head>
<body>

<header>
    <div class="logo-titulo">
        <img src="favicon (1).ico" alt="Logo PGS" class="logo">
        <div>
            <h1>portal geografico <span>sul-americano</span></h1>
            <p>PGS — INFORMAÇÃO E TERRITÓRIO</p>
        </div>
    </div>
</header>

<div class="login-box">
    <h2>Olá, <span>bem-vindo</span> de volta!</h2>
    <hr>

    <input type="email" id="email" placeholder="E-mail">

    <div class="senha-box">
        <input type="password" id="senha" placeholder="Senha">
        <img src="olho.png" id="olho-senha" onclick="verSenha('senha', 'olho-senha')" class="olho">
    </div>

    <button class="btn-entrar" onclick="entrar()">ENTRAR</button>

    <hr>

    <p class="rodape">Não tem uma conta? <a href="cadastar.html">Criar conta</a></p>
    <p class="rodape">Quer voltar? <a href="index.html">Menu</a></p>
</div>

<script src="login.js"></script>
</body>
</html>
